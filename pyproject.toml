[project]
name = "seizure-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
seizure-detection = "seizure_detection:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[dependency-groups]
sam3 = [
    "accelerate>=1.15.0",
    "huggingface-hub>=2.4.0",
    "pillow>=13.0.0",
    "transformers>=5.23.0",
]

